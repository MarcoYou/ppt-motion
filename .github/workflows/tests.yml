name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.13']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: skill/ppt-motion/scripts/requirements.txt
      - run: python -m pip install -r skill/ppt-motion/scripts/requirements.txt
      - run: python -m unittest discover -s tests -v
